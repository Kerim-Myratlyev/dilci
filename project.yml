# Optional: regenerate the Xcode project with XcodeGen (brew install xcodegen && xcodegen)
name: Dilci
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DILCI_ID: app.dilci.translate
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dilci:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: DilciKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DILCI_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/App-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dilçi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Dilci.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  DilciKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DILCI_ID).keyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Keyboard-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dilçi
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/DilciKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1"
